<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-label="Placeholder product shot of a display figure on a lit pedestal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1c45"/>
      <stop offset=".62" stop-color="#070d20"/>
      <stop offset="1" stop-color="#04060f"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="34%" r="46%">
      <stop offset="0" stop-color="#2f6bff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ped" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132a63"/>
      <stop offset="1" stop-color="#060b1a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <rect width="600" height="750" fill="url(#spot)"/>

  <!-- studio backdrop seams -->
  <g stroke="#4fe3ff" stroke-opacity=".14" stroke-width="1.5">
    <line x1="300" y1="0" x2="300" y2="640"/>
    <line x1="0" y1="196" x2="600" y2="196"/>
  </g>

  <!-- figure -->
  <g transform="translate(300 132) scale(1.9)">
    <circle cx="0" cy="26" r="21" fill="#060b1a" stroke="#4fe3ff" stroke-width="2"/>
    <!-- long hair, drawn as a soft arc -->
    <path d="M-22 26q0-28 22-28t22 28q-6 16-10 22 2-18-12-18t-12 18q-4-6-10-22Z" fill="#4fe3ff" opacity=".22"/>
    <path d="M-11 42h22l5 6 22 9 8 42-17-4 6 30h-70l6-30-17 4 8-42 22-9Z" fill="#060b1a" stroke="#4fe3ff" stroke-width="2"/>
    <path d="M0 54v56" stroke="#4fe3ff" stroke-width="1.4" opacity=".7"/>
    <path d="M-20 92 0 104l20-12" stroke="#4fe3ff" stroke-width="1.4" opacity=".7" fill="none"/>
  </g>

  <!-- amber bloom in one hand -->
  <circle cx="322" cy="336" r="17" fill="#ffb545"/>
  <circle cx="322" cy="336" r="34" fill="#ffb545" opacity=".16"/>

  <!-- pedestal -->
  <path d="M164 600h272l-26 108H190Z" fill="url(#ped)" stroke="#4fe3ff" stroke-opacity=".45" stroke-width="2"/>
  <rect x="164" y="588" width="272" height="16" fill="#1b3fd8"/>
  <rect x="164" y="588" width="272" height="3" fill="#4fe3ff"/>
  <!-- figure reflection -->
  <g opacity=".16" transform="translate(300 700) scale(1.9) scale(1,-1)">
    <circle cx="0" cy="26" r="21" fill="#4fe3ff"/>
    <path d="M-11 42h22l5 6 22 9 8 42-17-4 6 30h-70l6-30-17 4 8-42 22-9Z" fill="#4fe3ff"/>
  </g>

  <!-- floor dots -->
  <g fill="#4fe3ff" opacity=".2">
    <circle cx="80" cy="726" r="2"/><circle cx="140" cy="736" r="2"/><circle cx="470" cy="734" r="2"/>
    <circle cx="520" cy="722" r="2"/>
  </g>
</svg>