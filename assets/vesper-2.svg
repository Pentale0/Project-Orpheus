<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-label="Placeholder cover art, abstract blue scene with two silhouettes and a rain of light streaks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1c45"/>
      <stop offset=".5" stop-color="#070d20"/>
      <stop offset="1" stop-color="#04060f"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="28%" r="60%">
      <stop offset="0" stop-color="#4fe3ff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#4fe3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeaff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity=".2"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <rect width="600" height="750" fill="url(#glow)"/>

  <!-- light streaks -->
  <g stroke="url(#blade)" stroke-width="3">
    <line x1="60"  y1="120" x2="140" y2="430"/>
    <line x1="150" y1="90"  x2="226" y2="386"/>
    <line x1="430" y1="140" x2="360" y2="440"/>
    <line x1="516" y1="110" x2="446" y2="410"/>
  </g>

  <!-- large moon disc behind everything -->
  <circle cx="300" cy="286" r="150" fill="#4fe3ff" opacity=".1"/>
  <circle cx="300" cy="286" r="150" fill="none" stroke="#4fe3ff" stroke-opacity=".4" stroke-width="2"/>

  <!-- two silhouettes facing each other -->
  <g transform="translate(178 250)">
    <circle cx="50" cy="28" r="20" fill="#04060f" stroke="#4fe3ff" stroke-width="2"/>
    <path d="M40 44h20l5 6 22 8 7 42-16-4 6 28H24l6-28-16 4 7-42 24-8Z" fill="#04060f" stroke="#4fe3ff" stroke-width="2"/>
  </g>
  <g transform="translate(330 236)">
    <circle cx="50" cy="28" r="20" fill="#04060f" stroke="#dbeaff" stroke-width="2"/>
    <path d="M28 26q0-24 22-24t22 24q-7-11-22-11T28 26Z" fill="#dbeaff" opacity=".22"/>
    <path d="M40 44h20l6 7 26 9 8 44-17-4 6 30H21l6-30-17 4 8-44 26-9Z" fill="#04060f" stroke="#dbeaff" stroke-width="2"/>
    <path d="M50 56v54" stroke="#dbeaff" stroke-width="1.4" opacity=".65"/>
  </g>

  <!-- ground -->
  <rect y="452" width="600" height="4" fill="#4fe3ff" opacity=".45"/>
  <g fill="#0e1c45">
    <path d="M0 456h600v294H0Z"/>
  </g>
  <g fill="#04060f" opacity=".9">
    <path d="M0 470q150-22 300 0t300 0v280H0Z"/>
  </g>

  <!-- title bars -->
  <g>
    <rect x="56" y="556" width="150" height="8" fill="#4fe3ff"/>
    <rect x="56" y="590" width="330" height="26" fill="#ffffff" opacity=".92"/>
    <rect x="56" y="628" width="210" height="26" fill="#ffffff" opacity=".5"/>
    <rect x="56" y="678" width="96" height="6" fill="#ffb545"/>
  </g>
</svg>