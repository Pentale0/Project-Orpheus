<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-label="Placeholder product shot of a figure holding a glowing lantern">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#04060f"/>
      <stop offset=".55" stop-color="#070d20"/>
      <stop offset="1" stop-color="#0e1c45"/>
    </linearGradient>
    <radialGradient id="lamp" cx="64%" cy="44%" r="34%">
      <stop offset="0" stop-color="#ffb545" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ffb545" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <rect width="600" height="750" fill="url(#lamp)"/>

  <!-- smoke wisps -->
  <g stroke="#4fe3ff" stroke-opacity=".2" stroke-width="3" fill="none">
    <path d="M392 300q34-40 6-78t10-80"/>
    <path d="M410 316q30-44 2-84t8-72"/>
  </g>

  <!-- figure -->
  <g transform="translate(268 160) scale(1.86)">
    <circle cx="0" cy="26" r="21" fill="#060b1a" stroke="#4fe3ff" stroke-width="2"/>
    <path d="M-22 30q2-30 22-30t22 30q-8-14-22-14t-22 14Z" fill="#4fe3ff" opacity=".2"/>
    <path d="M-11 42h22l5 6 22 9 8 42-17-4 6 30h-70l6-30-17 4 8-42 22-9Z" fill="#060b1a" stroke="#4fe3ff" stroke-width="2"/>
    <path d="M0 54v56" stroke="#4fe3ff" stroke-width="1.4" opacity=".7"/>
    <!-- arm reaching out to the lantern -->
    <path d="M30 62l24 8" stroke="#4fe3ff" stroke-width="2" fill="none"/>
  </g>

  <!-- lantern -->
  <g>
    <path d="M322 372v14" stroke="#ffd76a" stroke-width="3"/>
    <path d="M300 386h44l-8 54h-28Z" fill="#ffb545" opacity=".28" stroke="#ffd76a" stroke-width="2.5"/>
    <circle cx="322" cy="414" r="15" fill="#ffd76a"/>
    <circle cx="322" cy="414" r="42" fill="#ffb545" opacity=".18"/>
    <path d="M306 386l8 14 8-14M330 386l-8 14-8-14" stroke="#ffd76a" stroke-width="1.6" fill="none" opacity=".7"/>
  </g>

  <!-- pedestal -->
  <path d="M170 574h260l-24 122H194Z" fill="#0e1c45" stroke="#4fe3ff" stroke-opacity=".42" stroke-width="2"/>
  <rect x="170" y="562" width="260" height="16" fill="#1b3fd8"/>
  <rect x="170" y="562" width="260" height="3" fill="#ffb545"/>
  <!-- lantern light pooling on the pedestal -->
  <ellipse cx="322" cy="572" rx="120" ry="16" fill="#ffb545" opacity=".2"/>
</svg>