<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-label="Placeholder cover art, abstract countdown dial and descending light column in night blue">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1330"/>
      <stop offset=".7" stop-color="#060b1a"/>
      <stop offset="1" stop-color="#04060f"/>
    </linearGradient>
    <radialGradient id="moonshot" cx="50%" cy="30%" r="45%">
      <stop offset="0" stop-color="#dbeaff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#dbeaff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeaff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#4fe3ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <rect width="600" height="750" fill="url(#moonshot)"/>

  <!-- huge countdown dial -->
  <g transform="translate(300 300)">
    <circle r="212" fill="none" stroke="#4fe3ff" stroke-opacity=".22" stroke-width="1.6"/>
    <circle r="150" fill="none" stroke="#4fe3ff" stroke-opacity=".32" stroke-width="1.6"/>
    <!-- tick marks -->
    <g stroke="#4fe3ff" stroke-opacity=".55" stroke-width="3">
      <line x1="0" y1="-212" x2="0" y2="-186"/>
      <line x1="0" y1="212"  x2="0" y2="186"/>
      <line x1="-212" y1="0" x2="-186" y2="0"/>
      <line x1="212" y1="0"  x2="186" y2="0"/>
      <line x1="-150" y1="-150" x2="-132" y2="-132"/>
      <line x1="150" y1="-150"  x2="132" y2="-132"/>
      <line x1="-150" y1="150"  x2="-132" y2="132"/>
      <line x1="150" y1="150"   x2="132" y2="132"/>
    </g>
    <!-- hands locked just before midnight -->
    <line x1="0" y1="0" x2="-56" y2="-118" stroke="#ffb545" stroke-width="5"/>
    <line x1="0" y1="0" x2="96"  y2="82"   stroke="#dbeaff" stroke-width="4"/>
    <circle r="8" fill="#ffb545"/>
  </g>

  <!-- descending light column -->
  <rect x="256" y="60" width="88" height="330" fill="url(#fall)"/>
  <ellipse cx="300" cy="404" rx="70" ry="16" fill="#4fe3ff" opacity=".25"/>

  <!-- receiver dish -->
  <g transform="translate(300 470)">
    <path d="M-64 0a64 34 0 0 1 128 0Z" fill="#0e1c45" stroke="#4fe3ff" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="0" y2="76" stroke="#4fe3ff" stroke-width="3"/>
    <line x1="-30" y1="76" x2="30" y2="76" stroke="#4fe3ff" stroke-width="3"/>
    <circle cx="0" cy="-8" r="7" fill="#ffb545"/>
  </g>

  <rect y="576" width="600" height="3" fill="#4fe3ff" opacity=".35"/>

  <!-- countdown numerals as abstract bars -->
  <g>
    <rect x="56" y="606" width="200" height="8" fill="#4fe3ff"/>
    <rect x="56" y="640" width="340" height="26" fill="#ffffff" opacity=".92"/>
    <rect x="56" y="678" width="160" height="26" fill="#ffffff" opacity=".5"/>
    <rect x="404" y="606" width="140" height="8" fill="#ffb545"/>
  </g>
</svg>