<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-label="Placeholder cover art for the foil-stamped first edition, night blue with a warm gold treatment">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1c45"/>
      <stop offset=".55" stop-color="#070d20"/>
      <stop offset="1" stop-color="#04060f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="52%">
      <stop offset="0" stop-color="#ffb545" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffb545" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset=".5" stop-color="#ffb545"/>
      <stop offset="1" stop-color="#dbeaff"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <rect width="600" height="750" fill="url(#halo)"/>

  <!-- gold ring -->
  <circle cx="300" cy="292" r="176" fill="none" stroke="url(#foil)" stroke-width="3" opacity=".85"/>
  <circle cx="300" cy="292" r="196" fill="none" stroke="url(#foil)" stroke-width="1.2" opacity=".45"/>

  <!-- eclipse: pale disc with a dark disc sliding across it -->
  <circle cx="300" cy="292" r="112" fill="#dbeaff" opacity=".9"/>
  <circle cx="348" cy="268" r="112" fill="#0a1330"/>

  <!-- figure beneath -->
  <g transform="translate(300 236) scale(1.05)">
    <ellipse cx="0" cy="146" rx="46" ry="9" fill="#04060f" opacity=".85"/>
    <circle cx="0" cy="0" r="20" fill="#04060f" stroke="#ffd76a" stroke-width="2"/>
    <path d="M-21 2q0-26 21-26t21 26q-7-12-21-12T-21 2Z" fill="#ffd76a" opacity=".2"/>
    <path d="M-10 16h20l5 6 21 8 8 40-16-4 5 28h-72l5-28-16 4 8-40 21-8Z" fill="#04060f" stroke="#ffd76a" stroke-width="2"/>
    <path d="M0 28v52" stroke="#ffd76a" stroke-width="1.4" opacity=".7"/>
  </g>

  <!-- foil sparkle marks -->
  <g fill="#ffd76a" opacity=".85">
    <path d="M124 172l4 12 12 4-12 4-4 12-4-12-12-4 12-4Z"/>
    <path d="M486 402l3 9 9 3-9 3-3 9-3-9-9-3 9-3Z"/>
    <circle cx="152" cy="404" r="4"/>
    <circle cx="452" cy="152" r="3"/>
  </g>

  <rect y="500" width="600" height="250" fill="#04060f" opacity=".55"/>

  <g>
    <rect x="56" y="556" width="230" height="8" fill="url(#foil)"/>
    <rect x="56" y="590" width="380" height="28" fill="url(#foil)"/>
    <rect x="56" y="630" width="240" height="28" fill="#ffffff" opacity=".85"/>
    <rect x="56" y="682" width="150" height="6" fill="#4fe3ff"/>
    <rect x="230" y="682" width="80" height="6" fill="#ffffff" opacity=".4"/>
  </g>
</svg>