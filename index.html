<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Orpheus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050a1f">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-shapes" aria-hidden="true"></div>
  <div class="app-container">
    <aside class="sidebar">
      <nav class="nav-menu">
        <button class="nav-btn active" data-view="library">LIBRARY</button>
        <button class="nav-btn" data-view="playlists">PLAYLISTS</button>
        <button class="nav-btn" data-view="nowplaying">NOW PLAYING</button>
      </nav>
      <div class="sidebar-content">
        <div class="import-section">
          <button class="import-btn" id="importBtn">IMPORT MP3S</button>
          <input type="file" id="fileInput" accept="audio/mpeg,audio/mp3" multiple hidden>
        </div>
        <div class="playlist-list" id="playlistList"></div>
      </div>
    </aside>
    <main class="main-content">
      <header class="view-header">
        <h1 id="viewTitle">LIBRARY</h1>
      </header>
      <div class="view-content" id="viewContent"></div>
    </main>
  </div>
  <footer class="player-bar">
    <div class="player-cover-container">
      <div class="player-cover-frame">
        <img id="playerCover" src="" alt="" />
        <div class="cover-placeholder"></div>
      </div>
    </div>
    <div class="player-info">
      <div class="player-title" id="playerTitle">No Track Selected</div>
      <div class="player-artist" id="playerArtist">-</div>
    </div>
    <div class="player-controls">
      <div class="control-buttons">
        <button class="ctrl-btn" id="prevBtn">⏮</button>
        <button class="ctrl-btn play-pause" id="playPauseBtn">▶</button>
        <button class="ctrl-btn" id="nextBtn">⏭</button>
        <button class="ctrl-btn" id="shuffleBtn">⤨</button>
        <button class="ctrl-btn" id="repeatBtn">⥁</button>
      </div>
      <div class="progress-container">
        <span class="time" id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
        <span class="time" id="duration">0:00</span>
      </div>
    </div>
    <div class="player-volume">
      <button class="ctrl-btn" id="muteBtn">🔊</button>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
    </div>
  </footer>
  <audio id="audioPlayer"></audio>
  <script src="https://unpkg.com/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
  <script src="https://unpkg.com/idb@8/build/umd.js"></script>
  <script src="js/db.js"></script>
  <script src="js/importer.js"></script>
  <script src="js/player.js"></script>
  <script src="js/library.js"></script>
  <script src="js/playlists.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
